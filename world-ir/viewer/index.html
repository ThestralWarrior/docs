<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

    {
      "imports": {
        "three": "./node_modules/three/build/three.module.js",
        "three/addons/": "./node_modules/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import { start } from "./src/app.js";
    start({
      scenes: ["bedroom", "horror_room", "minimal", "cabin_clearing", "scifi_colony", "generated_flat", "generated_cafe", "generated_surreal", "generated_kitchen"],
      defaultScene: "bedroom",
    });

</html>
